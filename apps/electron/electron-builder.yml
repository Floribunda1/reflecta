appId: com.acnoo.reflecta
productName: Reflecta
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!**/*.map"
  - "!**/node_modules/@types/**"
  - "!**/node_modules/**/*.d.ts"
  - "!**/node_modules/**/test/**"
  - "!**/node_modules/**/tests/**"
  - "!**/node_modules/**/__tests__/**"
  - "!**/node_modules/**/docs/**"
  - "!**/node_modules/**/examples/**"
  - "!**/node_modules/**/benchmark/**"
  - "!**/node_modules/**/*.md"
  - "!**/node_modules/**/LICENSE*"
  - "!**/node_modules/**/CHANGELOG*"
  - "!**/node_modules/**/README*"
  - "!**/node_modules/**/.github/**"
  - "!**/node_modules/**/.vscode/**"
  - "!**/node_modules/!(pi-web-access)/**/*.ts"
asarUnpack:
  - "node_modules/pi-web-access/**/*"
win:
  executableName: Reflecta
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: "-"
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: .cache/sparkle-cli/sparkle.app
      to: sparkle.app
    - from: .cache/sparkle-cli/Sparkle-LICENSE.txt
      to: licenses/Sparkle-LICENSE.txt
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - SUFeedURL: https://github.com/Floribunda1/reflecta/releases/latest/download/appcast.xml
    - SUPublicEDKey: DYePZoCJq199EnWefYhAcFT90sGJw9zKrBfHDe8BD0Q=
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
