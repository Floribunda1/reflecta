pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx oxlint --fix && bunx oxfmt --no-error-on-unmatched-pattern
      stage_fixed: true

pre-push:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx oxlint && bunx oxfmt --check
    typecheck:
      run: bun run typecheck
